name: Java CI with Maven

on:
  push:
    branches: [ "J2EE" ]
  pull_request:
    branches: [ "J2EE" ]

env :
    secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER : "azurecontainer1.azurecr.io"


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: log in to azure container Registry
      uses: azure/login@v1
      with:
        login-server: ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}
        username: ${{ secrets.AZURE_CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.Azure_container_REGISTRY_PASSWORD }}
    - name: Docker login to ACR
      run: |
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}

    - name: Docker build image
      run: |
        docker build -t ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/myapp:latest .
    
    - name: Docker push Image to container
      run: |
         docker push ${{ secrets.AZURE_CONTAINER_REGISTRY_LOGIN_SERVER }}/myapp:latest
         
         
